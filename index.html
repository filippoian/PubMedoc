<!doctype html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Primary Meta Tags -->
    <!-- Nota: description/canonical/hreflang variabili per lingua/pagina sono gestiti
         dinamicamente da React Helmet (src/components/SeoHead.jsx) per Google/Bing (che eseguono JS).
         og:*/twitter:* restano statici (italiano) perché i crawler social (Facebook/WhatsApp/Twitter)
         NON eseguono JavaScript e leggono solo questo HTML iniziale. -->
    <title>Medoc Pub - Birreria Pinseria Paninoteca San Benedetto del Tronto</title>
    <meta name="keywords"
        content="pub, birreria, pinseria, paninoteca, san benedetto del tronto, birre artigianali, hamburger, aperitivo, cena">
    <meta name="author" content="Medoc Pub">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pubmedocmenu.com/">
    <meta property="og:title" content="Medoc Pub - Birreria Pinseria Paninoteca San Benedetto del Tronto">
    <meta property="og:description"
        content="Medoc Pub a San Benedetto del Tronto. Birre artigianali, pinse romane, hamburger gourmet e tanto altro.">
    <meta property="og:image" content="https://pubmedocmenu.com/logo.png">
    <meta property="og:locale" content="it_IT">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://pubmedocmenu.com/">
    <meta property="twitter:title" content="Medoc Pub - Birreria Pinseria Paninoteca San Benedetto del Tronto">
    <meta property="twitter:description"
        content="Medoc Pub a San Benedetto del Tronto. Birre artigianali, pinse romane, hamburger gourmet e tanto altro.">
    <meta property="twitter:image" content="https://pubmedocmenu.com/logo.png">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "Medoc Pub",
      "image": "https://pubmedocmenu.com/logo.png",
      "@id": "https://pubmedocmenu.com",
      "url": "https://pubmedocmenu.com",
      "telephone": "+393780919110",
      "menu": "https://pubmedocmenu.com/#menu",
      "sameAs": [
        "https://instagram.com/medocpub"
      ],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Via Monfalcone, 10",
        "addressLocality": "San Benedetto del Tronto",
        "addressRegion": "AP",
        "postalCode": "63074",
        "addressCountry": "IT"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 42.9497, 
        "longitude": 13.8797
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": [
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday",
          "Sunday"
        ],
        "opens": "18:00",
        "closes": "02:00"
      },
      "servesCuisine": ["Pub Food", "Pizza", "Hamburger", "Beer"],
      "priceRange": "$$"
    }
    </script>

    <!-- Ottimizzazioni di Performance -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">

    <!-- Ottimizzato per iOS Safari -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <!-- iOS Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Medoc Pub" />

    <!-- Android -->
    <meta name="theme-color" content="#FF6B35" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
